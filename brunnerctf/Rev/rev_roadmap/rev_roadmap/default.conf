server {
    listen 80;
    server_name _;
    default_type text/html;

    location = / {
        return 200 "<!doctype html><meta charset=utf-8><title>Brunnerne Inc.</title><h1>Brunnerne Inc.&trade; Roadmap Router</h1><p>Only stakeholders who walk the approved roadmap reach clearance. The router config is published for full corporate transparency. Follow it to the letter.</p>\n";
    }

    location / {
        if ($access) {
            return 200 "<!doctype html><meta charset=utf-8><title>Cleared</title><h1>&#9989; Access cleared, stakeholder.</h1><p>You walked the corporate roadmap to the letter. Welcome aboard Brunnerne Inc.&trade;</p>\n";
        }
        return 403 "<!doctype html><meta charset=utf-8><title>Detour</title><h1>&#9940; Detour.</h1><p>This road is not on the approved roadmap. Circle back and realign.</p>\n";
    }
}
